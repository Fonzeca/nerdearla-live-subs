<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Subtítulos en vivo</title>
<style>
  :root { --bg: #0b0b0f; --fg: #f5f5f5; --muted: #9aa0a6; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 600 clamp(20px, 3.4vw, 46px)/1.3 system-ui, sans-serif;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 0 4vw 5vh; box-sizing: border-box; overflow: hidden;
  }
  body.overlay { --bg: transparent; text-shadow: 0 2px 6px #000, 0 0 2px #000; }
  .line { margin: .35em 0; }
  .orig { color: var(--muted); font-weight: 400; font-size: .6em; }
  #partial { color: var(--muted); font-style: italic; font-weight: 400; font-size: .7em; min-height: 1.3em; }
  body.show-es .orig, body.show-es #partial { display: none; }
  body.show-orig .es { display: none; }
  #st { position: fixed; top: 8px; right: 12px; font: 12px system-ui; color: var(--muted); }
</style>
</head>
<body>
<div id="st">conectando…</div>
<div id="lines"></div>
<div id="partial"></div>
<script>
  // Parámetros: ?overlay (fondo transparente para OBS) &show=es|orig|both &lines=3
  const sid = location.pathname.split('/').pop();
  const q = new URLSearchParams(location.search);
  if (q.has('overlay')) document.body.classList.add('overlay');
  document.body.classList.add('show-' + (q.get('show') || 'both'));
  const MAXL = +(q.get('lines') || 3);
  const $lines = document.getElementById('lines');
  const $partial = document.getElementById('partial');
  const $st = document.getElementById('st');
  const segs = new Map();
  let last = null, delay = 500;

  function line(seg) {
    let el = segs.get(seg);
    if (!el) {
      el = document.createElement('div');
      el.className = 'line';
      el.dataset.seg = seg;
      el.innerHTML = '<div class="es"></div><div class="orig"></div>';
      $lines.append(el);
      segs.set(seg, el);
      while ($lines.children.length > MAXL) {
        segs.delete($lines.firstChild.dataset.seg);
        $lines.firstChild.remove();
      }
    }
    return el;
  }

  function on(m) {
    if (m.type === 'partial') {
      if (Date.now() / 1000 - m.ts < 10) $partial.textContent = m.text;  // ignora parciales viejos del historial
      return;
    }
    const el = line(m.seg);
    if (m.type === 'final') { $partial.textContent = ''; el.querySelector('.orig').textContent = m.text; }
    if (m.type === 'tr') el.querySelector('.es').textContent = m.text;
  }

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${proto}://${location.host}/ws/${sid}` + (last ? `?last=${last}` : ''));
    ws.onopen = () => { $st.textContent = '● ' + sid; delay = 500; };
    ws.onmessage = e => {
      const m = JSON.parse(e.data);
      if (m.type === 'ping') return;
      last = m.id;
      on(m);
    };
    ws.onclose = () => { $st.textContent = 'reconectando…'; setTimeout(connect, delay = Math.min(delay * 2, 8000)); };
  }
  connect();
</script>
</body>
</html>
